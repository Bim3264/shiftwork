<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect x="0.0" y="0.0" width="1080.0" height="1080.0" fill="#F8FAFC" rx="0" /><rect x="0.0" y="0.0" width="1080.0" height="668.0" fill="#102A43" rx="0" /><circle cx="1010.0" cy="90.0" r="240.0" fill="#14B8A6" opacity="0.16"/><circle cx="1040.0" cy="120.0" r="130.0" fill="#14B8A6" opacity="0.22"/><circle cx="930.0" cy="598.0" r="90.0" fill="#14B8A6" opacity="0.12"/><text x="64" y="96" font-family="IBM Plex Sans Thai" font-size="40" font-weight="700"><tspan fill="#FFFFFF">Shift</tspan><tspan fill="#14B8A6">Work</tspan></text><rect x="64.0" y="128.0" width="303.2" height="46.0" fill="#14B8A6" rx="23" /><text x="215.6" y="159.0" font-family="IBM Plex Sans Thai" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">โปรโมชั่นชวนเพื่อน</text><text x="64.0" y="288.0" font-family="IBM Plex Sans Thai" font-size="90" font-weight="700" fill="#FFFFFF" text-anchor="start">ชวน 1 วอร์ด</text><text x="64" y="388" font-family="IBM Plex Sans Thai" font-size="90" font-weight="700"><tspan fill="#14B8A6">ฟรี 1 เดือน</tspan></text><rect x="64.0" y="420.0" width="578.0" height="58.0" fill="#E6FAF6" rx="29" /><text x="353.0" y="459.0" font-family="IBM Plex Sans Thai" font-size="30" font-weight="700" fill="#0F9488" text-anchor="middle">ฟรีทั้งคู่ — ทั้งคุณและเพื่อน</text><circle cx="80.0" cy="528.0" r="15.0" fill="#14B8A6" opacity="1.0"/><path d="M 73.0 528.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112.0" y="536.0" font-family="IBM Plex Sans Thai" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">เพื่อนที่คุณชวน ได้ใช้ฟรีเดือนแรก</text><circle cx="80.0" cy="574.0" r="15.0" fill="#14B8A6" opacity="1.0"/><path d="M 73.0 574.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112.0" y="582.0" font-family="IBM Plex Sans Thai" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">เมื่อเพื่อนเริ่มจ่ายจริง คุณได้ฟรีอีก 1 เดือน</text><circle cx="80.0" cy="620.0" r="15.0" fill="#14B8A6" opacity="1.0"/><path d="M 73.0 620.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="112.0" y="628.0" font-family="IBM Plex Sans Thai" font-size="27" font-weight="400" fill="#FFFFFF" text-anchor="start">ชวนได้ไม่จํากัด — ยิ่งชวนยิ่งฟรี</text><text x="64.0" y="730.0" font-family="IBM Plex Sans Thai" font-size="32" font-weight="700" fill="#102A43" text-anchor="start">แล้ว ShiftWork คืออะไร?</text><text x="64.0" y="776.0" font-family="IBM Plex Sans Thai" font-size="25" font-weight="400" fill="#1F2937" text-anchor="start">ระบบจัดตารางเวรพยาบาลอัตโนมัติ เสร็จในไม่กี่นาที</text><text x="64.0" y="810.0" font-family="IBM Plex Sans Thai" font-size="25" font-weight="400" fill="#1F2937" text-anchor="start">จัดเวรยุติธรรม สมดุลภาระงาน ทํางานน้อยลง</text><rect x="64.0" y="844.0" width="216.4" height="48.0" fill="#E6FAF6" rx="24" /><circle cx="90.0" cy="868.0" r="11.0" fill="#0F9488" opacity="1.0"/><path d="M 83.0 868.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="108.0" y="875.0" font-family="IBM Plex Sans Thai" font-size="22" font-weight="600" fill="#0F9488" text-anchor="start">เสร็จไวทันใจ</text><rect x="296.4" y="844.0" width="242.8" height="48.0" fill="#E6FAF6" rx="24" /><circle cx="322.4" cy="868.0" r="11.0" fill="#0F9488" opacity="1.0"/><path d="M 315.4 868.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="340.4" y="875.0" font-family="IBM Plex Sans Thai" font-size="22" font-weight="600" fill="#0F9488" text-anchor="start">จัดเวรยุติธรรม</text><rect x="555.2" y="844.0" width="216.4" height="48.0" fill="#E6FAF6" rx="24" /><circle cx="581.2" cy="868.0" r="11.0" fill="#0F9488" opacity="1.0"/><path d="M 574.2 868.0 l 5 5 l 9 -11" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="599.2" y="875.0" font-family="IBM Plex Sans Thai" font-size="22" font-weight="600" fill="#0F9488" text-anchor="start">สมดุลภาระงาน</text><rect x="200.4" y="940.0" width="679.2" height="78.0" fill="#14B8A6" rx="39" /><text x="524.0" y="990.0" font-family="IBM Plex Sans Thai" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">ทักแชทเพจ ShiftWork เพื่อเริ่มใช้ฟรี</text><path d="M 837.6 970.0 l 12 9 l -12 9" stroke="#FFFFFF" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>